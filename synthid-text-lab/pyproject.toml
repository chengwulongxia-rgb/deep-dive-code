[project]
name = "synthid-text-lab"
version = "0.1.0"
description = "CPU SynthID Text experiment and explicitly simplified tournament analogy"
requires-python = ">=3.11,<3.12"
dependencies = ["torch==2.8.0+cpu", "transformers==4.57.1", "matplotlib==3.10.7", "numpy==2.3.4"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
